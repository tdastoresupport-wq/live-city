name: LIVE CITY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    name: Typecheck, Lint, Test, Build, Smoke & Load (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean Dependency Install
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Verification
        run: npm run lint

      - name: Automated Vitest Suite
        run: npm test

      - name: Production Vite Build
        run: npm run build

      - name: Authoritative Server Smoke Test
        run: npm run test:smoke

      - name: Engine 60-Citizen Load Benchmark
        run: npm run test:load
